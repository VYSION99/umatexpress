<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- UMaTeXPRESS mark: the leaf and its circuit traces on the dark plate, drawn
       as vectors so the tab icon stays sharp at 16px and on any DPI. -->
  <defs>
    <linearGradient id="plate" x1="6" y1="2" x2="58" y2="62" gradientUnits="userSpaceOnUse">
      <stop stop-color="#082216"/>
      <stop offset="1" stop-color="#010c07"/>
    </linearGradient>
    <linearGradient id="leaf" x1="18" y1="14" x2="42" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b9f96d"/>
      <stop offset=".52" stop-color="#4cc94a"/>
      <stop offset="1" stop-color="#16793a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(32 30) scale(26 21)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3fd45f" stop-opacity=".45"/>
      <stop offset="1" stop-color="#3fd45f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#plate)"/>
  <ellipse cx="32" cy="30" rx="26" ry="21" fill="url(#glow)"/>

  <g stroke="#4fd36a" stroke-width="1.5" stroke-linecap="round" opacity=".6">
    <path d="M6 24h9M5 32h8M7 40h9"/>
    <path d="M48 22h10M49 31h10M47 40h10"/>
  </g>
  <g fill="#6ee27f" opacity=".75">
    <circle cx="6" cy="24" r="1.3"/><circle cx="5" cy="32" r="1.3"/><circle cx="7" cy="40" r="1.3"/>
    <circle cx="58" cy="22" r="1.3"/><circle cx="59" cy="31" r="1.3"/><circle cx="57" cy="40" r="1.3"/>
  </g>

  <!-- The leaf runs slightly large for its box: at 16px the plate and the leaf
       have about six pixels between them, and a leaf drawn to scale muddies into
       the plate at that size. -->
  <g transform="translate(32 33) scale(1.14) translate(-32 -33)">
    <path d="M20 54C11 36 21 14 46 10C46 30 37 46 20 54Z" fill="url(#leaf)"/>
    <path d="M24 50C30 38 36 25 43 14" stroke="#f3ffe6" stroke-width="1.5" stroke-linecap="round" opacity=".85"/>
  </g>
</svg>
